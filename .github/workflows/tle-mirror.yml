# Satellite orbits (TLEs) for the satellites and launches layers, mirrored from CelesTrak every 6 hours.
# CelesTrak doesn't answer some cloud hosts (Railway's connections time out), so the server falls back to this copy
# on the tle-data branch (server/providers/space/celestrak.js, TLE_MIRROR_URL). Orbits a few hours old draw fine.
name: TLE mirror
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tle-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the groups
        run: |
          set -u
          mkdir -p out/tle
          ok=0
          for g in stations visual gps-ops glo-ops galileo geo starlink active; do
            if curl -fsS --retry 3 --retry-delay 5 -m 90 \
                 -A 'gods-eye-view-celestrak-proxy/1.0 (+https://github.com/navneeth2017-create/godseye)' \
                 "https://celestrak.org/NORAD/elements/gp.php?GROUP=${g}&FORMAT=tle" -o "out/tle/${g}.txt" \
               && grep -q '^1 ' "out/tle/${g}.txt"; then
              echo "${g}: $(grep -c '^1 ' "out/tle/${g}.txt") satellites"; ok=$((ok+1))
            else
              echo "::warning::${g} not fetched"; rm -f "out/tle/${g}.txt"
            fi
          done
          [ "$ok" -gt 0 ] || { echo "::error::CelesTrak gave nothing"; exit 1; }
      - name: Keep the groups that failed this time from the last run
        run: |
          git init -q prev && cd prev
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          # "No tle-data branch yet" (first run, ls-remote exit 2) is fine; "couldn't read it" is not: publishing
          # without the last copy would delete every group CelesTrak refused this time, so fail and keep the old one.
          for i in 1 2 3; do
            rc=0; git ls-remote --exit-code "$url" refs/heads/tle-data >/dev/null || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then break; fi
            sleep 10
          done
          if [ "$rc" -eq 0 ]; then
            got=0
            for i in 1 2 3; do git fetch -q --depth 1 "$url" tle-data && { got=1; break; }; sleep 10; done
            [ "$got" -eq 1 ] || { echo "::error::could not fetch the last tle-data; not publishing"; exit 1; }
            git checkout -q FETCH_HEAD
            for f in tle/*.txt; do [ -e "../out/$f" ] || cp "$f" "../out/$f"; done
          elif [ "$rc" -ne 2 ]; then
            echo "::error::could not read the last tle-data (git ls-remote exit $rc); not publishing"; exit 1
          fi
      - name: Publish to tle-data
        run: |
          cd out
          date -u +%Y-%m-%dT%H:%M:%SZ > tle/UPDATED
          git init -q -b tle-data
          git config user.name 'tle-mirror'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -qm "TLEs $(cat tle/UPDATED)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" tle-data
